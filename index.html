
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S. - AI Assistant</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #102b46, #050b15 65%);
  color: #d9f5ff;
  font-family: Arial, "Noto Sans JP", sans-serif;
}
header {
  padding: 22px;
  border-bottom: 1px solid #174d6a;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  color: #55dfff;
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 4px;
}
.status { color: #53e6b1; font-size: 12px; }
main {
  max-width: 850px;
  margin: auto;
  padding: 25px 18px;
}
.clock { text-align: center; margin: 25px 0; }
#time { font-size: 42px; color: #75e5ff; }
#date { color: #8aaec1; margin-top: 8px; }
.core {
  width: 190px;
  height: 190px;
  margin: 25px auto;
  border: 2px solid #35cfff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  box-shadow: 0 0 25px #087ba8, inset 0 0 25px #087ba8;
  position: relative;
}
.core::before {
  content: "";
  position: absolute;
  inset: 12px;
  border: 2px dashed #55dfff;
  border-radius: 50%;
  animation: spin 18s linear infinite;
}
.core::after {
  content: "";
  position: absolute;
  inset: 30px;
  border: 1px solid #168db8;
  border-radius: 50%;
}
.core span {
  color: #75e5ff;
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 3px;
  z-index: 1;
}
@keyframes spin { to { transform: rotate(360deg); } }
.panel {
  background: #0b1b2b;
  border: 1px solid #174d6a;
  border-radius: 12px;
  padding: 18px;
  margin: 18px 0;
  box-shadow: 0 5px 25px #0005;
}
.panel h2 {
  color: #55dfff;
  font-size: 15px;
  letter-spacing: 2px;
  margin-top: 0;
}
#messages {
  height: 190px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.message {
  padding: 11px 13px;
  border-radius: 9px;
  background: #102b40;
  line-height: 1.6;
}
.message.user { border-left: 3px solid #55dfff; }
.message.jarvis { border-left: 3px solid #48d9a9; }
.controls { display: flex; gap: 8px; margin-top: 12px; }
input {
  min-width: 0;
  flex: 1;
  padding: 13px;
  background: #071321;
  border: 1px solid #28617c;
  border-radius: 8px;
  color: white;
  outline: none;
}
button {
  background: #087da8;
  color: white;
  border: 1px solid #42cfff;
  padding: 11px 15px;
  border-radius: 8px;
  cursor: pointer;
}
button:hover { background: #0b9acb; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; }
footer {
  text-align: center;
  color: #63869c;
  font-size: 11px;
  padding: 25px;
}
@media(max-width: 500px) {
  #time { font-size: 34px; }
  .controls { flex-wrap: wrap; }
  .controls input { flex-basis: 100%; }
}
</style>
</head>
<body>
<header>
  <div class="logo">J.A.R.V.I.S.</div>
  <div class="status">● SYSTEM ONLINE</div>
</header>

<main>
  <section class="clock">
    <div id="time">00:00:00</div>
    <div id="date"></div>
  </section>

  <div class="core"><span>JARVIS</span></div>

  <section class="panel">
    <h2>PERSONAL AI ASSISTANT</h2>
    <div id="messages">
      <div class="message jarvis">
        JARVIS：こんにちは、マスター。<br>
        システムを起動しました。何をお手伝いしましょうか？
      </div>
    </div>
    <div class="controls">
      <input id="command" placeholder="メッセージを入力してください..." />
      <button onclick="sendMessage()">送信</button>
      <button onclick="startVoice()">🎤</button>
    </div>
  </section>

  <section class="panel">
    <h2>SYSTEM TOOLS</h2>
    <div class="tools">
      <button onclick="searchWeb()">🔎 Google検索</button>
      <button onclick="openWebsite()">🌐 サイトを開く</button>
      <button onclick="speak('いつでもお呼びください、マスター。')">🔊 音声テスト</button>
    </div>
  </section>
</main>

<footer>
  J.A.R.V.I.S. PERSONAL ASSISTANT / VERSION 1.0
  <br>AI CONNECTION: NOT CONNECTED
</footer>

<script>
function updateClock() {
  const now = new Date();
  document.getElementById("time").textContent =
    now.toLocaleTimeString("ja-JP");
  document.getElementById("date").textContent =
    now.toLocaleDateString("ja-JP", {
      year: "numeric", month: "long", day: "numeric", weekday: "long"
    });
}
updateClock();
setInterval(updateClock, 1000);

function addMessage(text, type) {
  const box = document.getElementById("messages");
  const message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;
  box.appendChild(message);
  box.scrollTop = box.scrollHeight;
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    addMessage("このブラウザは音声読み上げに対応していません。", "jarvis");
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ja-JP";
  utterance.rate = 1;
  window.speechSynthesis.speak(utterance);
}

function sendMessage() {
  const input = document.getElementById("command");
  const text = input.value.trim();
  if (!text) return;

  addMessage("マスター：" + text, "user");
  input.value = "";

  let reply = "申し訳ありません、現在AI本体は未接続です。Google検索やサイトを開く機能をお使いください。";

  if (text.includes("こんにちは")) {
    reply = "こんにちは、マスター。本日もよろしくお願いいたします。";
  } else if (text.includes("時間") || text.includes("何時")) {
    reply = "現在の時刻は " + new Date().toLocaleTimeString("ja-JP") + " です。";
  } else if (text.includes("日付") || text.includes("何日")) {
    reply = "今日は " + new Date().toLocaleDateString("ja-JP") + " です。";
  } else if (text.includes("検索")) {
    window.open("https://www.google.com/search?q=" +
      encodeURIComponent(text.replace("検索", "").trim()), "_blank");
    reply = "Google検索を開きました。";
  } else if (text.includes("ありがとう")) {
    reply = "どういたしまして、マスター。";
  }

  addMessage("JARVIS：" + reply, "jarvis");
  speak(reply);
}

document.getElementById("command").addEventListener("keydown", function(e) {
  if (e.key === "Enter") sendMessage();
});

function searchWeb() {
  const query = prompt("何を検索しますか？");
  if (query && query.trim()) {
    window.open("https://www.google.com/search?q=" +
      encodeURIComponent(query), "_blank");
  }
}

function openWebsite() {
  const address = prompt("開きたいサイトのURLを入力してください。");
  if (address && address.trim()) {
    let url = address.trim();
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    try {
      const parsed = new URL(url);
      if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
        throw new Error("Invalid URL");
      }
      window.open(parsed.href, "_blank");
    } catch {
      alert("正しいURLを入力してください。");
    }
  }
}

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("音声認識に対応していません。Chromeでお試しください。");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ja-JP";
  recognition.onresult = function(event) {
    document.getElementById("command").value =
      event.results[0][0].transcript;
    sendMessage();
  };
  recognition.onerror = function() {
    alert("音声を認識できませんでした。マイクの設定を確認してください。");
  };
  recognition.start();
}
</script>
</body>
</html>
